<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Universe</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        .node circle { stroke: #0d1117; stroke-width: 3px; cursor: pointer; transition: r 0.2s; }
        .node circle:hover { filter: brightness(1.2); r: 10; }
        .node text { font-family: sans-serif; font-size: 14px; fill: #c9d1d9; pointer-events: none; }
        .link { fill: none; stroke: #30363d; stroke-width: 2px; opacity: 0.8; }
        
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 100; width: 90%; max-width: 500px;
            max-height: 80vh; overflow-y: auto; text-align: center;
        }
        #modal.active { display: block; }
        #modal-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #8b949e; font-size: 24px; font-weight: bold; }
        #modal-close:hover { color: #ff7b72; }
        #modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13, 17, 23, 0.8); z-index: 99; backdrop-filter: blur(5px); }
        #modal-bg.active { display: block; }

        /* Стили для галереи пруфов */
        .media-item { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #30363d; }
        .media-link { display: block; margin-top: 15px; padding: 12px; background-color: #238636; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .media-link:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="modal-bg" onclick="closeModal()"></div>
    <div id="modal">
        <span id="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" style="margin-top: 0;"></h2>
        <p id="modal-desc"></p>
        <div id="modal-gallery"></div>
    </div>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#canvas-container").append("svg").attr("width", width).attr("height", height);
        const g = svg.append("g");
        
        const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);
        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));

        // Асинхронная загрузка
        d3.json("data.json").then(data => {
            const root = d3.hierarchy(data);
            const tree = d3.tree().size([2 * Math.PI, 500]);
            tree(root);

            const linkGenerator = d3.linkRadial().angle(d => d.x).radius(d => d.y);

            g.selectAll(".link")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", linkGenerator);

            const node = g.selectAll(".node")
                .data(root.descendants())
                .join("g")
                .attr("class", "node")
                .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`);

            node.append("circle")
                .attr("r", d => d.depth === 0 ? 15 : (d.depth === 1 ? 10 : 7))
                .style("fill", d => d.depth === 0 ? "#ff7b72" : (d.children ? "#d2a8ff" : "#1f6feb"))
                .on("click", (event, d) => showModal(d.data));

            node.append("text")
                .attr("dy", "0.31em")
                .attr("x", d => d.x < Math.PI === !d.children ? 20 : -20)
                .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
                .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                .text(d => d.name)
                .style("font-size", d => d.depth === 0 ? "24px" : (d.depth === 1 ? "18px" : "14px"))
                .style("fill", "#c9d1d9")
                .style("font-weight", d => d.depth === 0 ? "bold" : "normal")
                .style("text-shadow", "0 2px 4px rgba(0,0,0,0.9)");
        }).catch(err => console.error("Ошибка загрузки data.json:", err));

        // Рендер галереи в модалке
        function showModal(data) {
            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-desc').innerText = data.desc || "";
            
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = ""; // Очищаем старый контент

            if (data.media && data.media.length > 0) {
                data.media.forEach(item => {
                    if (item.type === "image") {
                        gallery.innerHTML += `<img src="${item.url}" class="media-item">`;
                    } else if (item.type === "video") {
                        gallery.innerHTML += `<video controls src="${item.url}" class="media-item"></video>`;
                    } else if (item.type === "link") {
                        gallery.innerHTML += `<a href="${item.url}" target="_blank" class="media-link">${item.text || "Перейти по ссылке"}</a>`;
                    }
                });
            }

            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-bg').classList.add('active');
        }

        // Очистка и закрытие
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('modal-bg').classList.remove('active');
            
            // Останавливаем видео при закрытии
            const videos = document.querySelectorAll('#modal-gallery video');
            videos.forEach(vid => vid.pause());
        }
    </script>
</body>
</html>
