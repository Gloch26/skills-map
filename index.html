<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Творческое убежище</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: radial-gradient(circle at center, #111a14 0%, #000000 80%); color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        #spores-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
        #canvas-container { position: relative; z-index: 1; width: 100vw; height: 100vh; cursor: grab; filter: blur(15px); transform: scale(1.05); transition: filter 1.5s ease, transform 1.5s ease; }
        #canvas-container:active { cursor: grabbing; }
        #canvas-container.ready { filter: blur(0px); transform: scale(1); }

        #welcome-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; transition: opacity 0.8s ease, visibility 0.8s; }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        #welcome-screen h1 { color: #87ff47; font-size: 3rem; margin-bottom: 10px; font-weight: 900; text-shadow: 0 0 20px rgba(135, 255, 71, 0.5); text-transform: uppercase; letter-spacing: 2px;}
        #welcome-screen p { max-width: 600px; font-size: 1.2rem; line-height: 1.6; margin-bottom: 40px; color: #a3b8a8; }
        #welcome-btn { padding: 15px 40px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; background-color: #2ea043; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(46, 160, 67, 0.6); }
        #welcome-btn:hover { background-color: #47ff69; box-shadow: 0 0 30px rgba(71, 255, 105, 0.8); transform: translateY(-2px); }

        .branch { fill: none; filter: url(#glow); stroke-linecap: round; }
        .data-branch { stroke: #6ded51; }
        
        /* Динамика для основных веток */
        @keyframes branchWiggle {
            0% { transform: skewX(0deg) skewY(0deg) scale(1); }
            25% { transform: skewX(0.8deg) skewY(-0.6deg) scale(1.005); }
            50% { transform: skewX(-0.6deg) skewY(0.8deg) scale(0.995); }
            75% { transform: skewX(0.4deg) skewY(0.5deg) scale(1.002); }
            100% { transform: skewX(0deg) skewY(0deg) scale(1); }
        }
        .data-branch { animation: branchWiggle 8s ease-in-out infinite; transform-origin: center; }

        /* Живая динамика для фоновых мелких усиков (колыхание + пульсация яркости) */
        @keyframes decWiggle {
            0% { transform: rotate(0deg) scale(1); opacity: 0.3; }
            33% { transform: rotate(0.6deg) scale(1.02); opacity: 0.55; }
            66% { transform: rotate(-0.5deg) scale(0.98); opacity: 0.25; }
            100% { transform: rotate(0deg) scale(1); opacity: 0.3; }
        }
        .dec-branch { 
            stroke: #3bb02e; 
            animation: decWiggle 12s ease-in-out infinite; 
            transform-origin: center; 
        }
        .dec-branch:nth-child(even) { animation-duration: 9s; animation-delay: -3s; }
        .dec-branch:nth-child(3n) { animation-duration: 15s; animation-delay: -6s; }

        .node circle { stroke: #000; stroke-width: 2px; cursor: pointer; transition: all 0.3s ease; }
        .node circle:hover { filter: brightness(1.5) drop-shadow(0 0 15px #87ff47); r: 16; }
        .node text { pointer-events: none; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 15px #000, 0 0 25px rgba(0,0,0,0.9); }

        @keyframes heartbeat { 0% { transform: scale(1); filter: brightness(1); } 15% { transform: scale(1.1); filter: brightness(1.4) drop-shadow(0 0 20px #de886a); } 30% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1); filter: brightness(1); } }
        .core-circle { animation: heartbeat 4s infinite; }
        
        @keyframes treeBreathe { 
            0% { transform: scale(1) rotate(0deg) translate(0px, 0px); } 
            33% { transform: scale(1.015) rotate(0.3deg) translate(1px, -1px); } 
            66% { transform: scale(0.995) rotate(-0.2deg) translate(-1px, 1px); } 
            100% { transform: scale(1) rotate(0deg) translate(0px, 0px); } 
        }
        .tree-layer { animation: treeBreathe 16s ease-in-out infinite; transform-origin: 0px 0px; }

        @keyframes floatNode { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
        .floating-node > * { animation: floatNode 6s ease-in-out infinite; }
        .floating-node:nth-child(even) > * { animation-delay: -2.5s; animation-duration: 7s; }

        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0d0b; border: 1px solid #2ea043; border-radius: 12px; padding: 25px; box-shadow: 0 0 40px rgba(46, 160, 67, 0.3); z-index: 100; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; text-align: center; color: #e6f0e8; }
        #modal.active { display: block; }
        #modal-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #5a7560; font-size: 24px; font-weight: bold; }
        #modal-close:hover { color: #87ff47; }
        #modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; backdrop-filter: blur(5px); }
        #modal-bg.active { display: block; }
        #modal-desc { color: #a3b8a8; font-size: 1rem; line-height: 1.5; margin-top: 10px; }
        .media-item { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #1a291e; }
        .media-audio-container { margin-top: 15px; background: #121f15; padding: 12px; border-radius: 8px; border: 1px solid #233827; }
        .media-audio-title { font-size: 0.9rem; color: #87ff47; margin-bottom: 6px; font-weight: bold; }
        audio { width: 100%; height: 35px; }
    </style>
</head>
<body>
    <canvas id="spores-canvas"></canvas>

    <div id="welcome-screen">
        <h1>Творческое убежище</h1>
        <p>Мой ответ на вопрос: кто я (и это не все).<br> Нажмите для проращивания нейронной структуры.</p>
        <button id="welcome-btn" onclick="enterUniverse()">Прорастить</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="modal-bg" onclick="closeModal()"></div>
    <div id="modal">
        <span id="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" style="margin-top: 0; color: #87ff47;"></h2>
        <p id="modal-desc"></p>
        <div id="modal-gallery"></div>
    </div>

    <script>
        const canvas = document.getElementById('spores-canvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth;
        let h = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

        const particles = Array.from({length: 100}, () => ({
            x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 0.5,
            dx: (Math.random() - 0.5) * 0.3, dy: (Math.random() - 0.5) * 0.3 - 0.2,
            alpha: Math.random() * Math.PI * 2, speed: Math.random() * 0.02 + 0.01
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.dx; p.y += p.dy; p.alpha += p.speed;
                if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(135, 255, 71, ${(Math.sin(p.alpha) + 1) / 2 * 0.6})`;
                ctx.shadowBlur = 8; ctx.shadowColor = "#87ff47"; ctx.fill();
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        let isGrown = false;
        function enterUniverse() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('canvas-container').classList.add('ready');
            if (!isGrown) { animateGrowth(); isGrown = true; }
        }

        const widthD3 = window.innerWidth;
        const heightD3 = window.innerHeight;
        const svg = d3.select("#canvas-container").append("svg").attr("width", widthD3).attr("height", heightD3);
        
        const defs = svg.append("defs");
        const filter = defs.append("filter")
            .attr("id", "glow")
            .attr("filterUnits", "userSpaceOnUse")
            .attr("x", "-50vw").attr("y", "-50vh")
            .attr("width", "200vw").attr("height", "200vh");
        filter.append("feGaussianBlur").attr("stdDeviation", "4").attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode").attr("in", "coloredBlur");
        feMerge.append("feMergeNode").attr("in", "SourceGraphic");

        const g = svg.append("g");
        const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);
        svg.call(zoom.transform, d3.zoomIdentity.translate(widthD3 / 2, heightD3 / 2).scale(0.95)); 

        const treeLayer = g.append("g").attr("class", "tree-layer");

        const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
        
        function getOrganicPath(x1, y1, x2, y2) {
            let dx = x2 - x1; let dy = y2 - y1;
            let dist = Math.hypot(dx, dy);
            let perpX = -dy / dist; let perpY = dx / dist;
            let seed = Math.sin(x1 * 12.9898 + y1 * 78.233) * 43758.5453;
            let noise = (seed - Math.floor(seed)) - 0.5;
            let bow = dist * 0.22 * noise;

            let p1x = x1 + dx * 0.3 + perpX * bow;
            let p1y = y1 + dy * 0.3 + perpY * bow;
            let p2x = x1 + dx * 0.7 - perpX * (bow * 0.9);
            let p2y = y1 + dy * 0.7 - perpY * (bow * 0.9);

            return lineGen([[x1, y1], [p1x, p1y], [p2x, p2y], [x2, y2]]);
        }

        d3.json("data.json").then(data => {
            const root = data instanceof Object ? d3.hierarchy(data) : data;
            
            root.eachBefore(d => {
                if (d.depth === 0) {
                    d.x = 0; d.y = 0;
                    d.cartX = 0; d.cartY = 0;
                } else if (d.depth === 1) {
                    const count = d.parent.children.length;
                    const i = d.parent.children.indexOf(d);
                    d.x = (i / count) * 2 * Math.PI + 0.001;
                    d.y = 220;
                    d.cartX = Math.cos(d.x - Math.PI/2) * d.y;
                    d.cartY = Math.sin(d.x - Math.PI/2) * d.y;
                } else {
                    const count = d.parent.children.length;
                    const i = d.parent.children.indexOf(d);
                    const rootSiblingsCount = d.parent.parent.children.length; 
                    const availableSector = (2 * Math.PI) / rootSiblingsCount;
                    const spread = availableSector * 0.85; 
                    
                    d.x = count === 1 ? d.parent.x : d.parent.x - spread/2 + (i / (count - 1)) * spread;
                    d.x += 0.001;
                    d.y = d.parent.y + 160;
                    d.cartX = Math.cos(d.x - Math.PI/2) * d.y;
                    d.cartY = Math.sin(d.x - Math.PI/2) * d.y;
                }
            });

            const links = root.links();
            treeLayer.selectAll(".data-branch")
                .data(links).join("path")
                .attr("class", "branch data-branch")
                .attr("d", d => getOrganicPath(d.source.cartX, d.source.cartY, d.target.cartX, d.target.cartY))
                .style("stroke-width", d => Math.max(2, 8 - (d.target.depth * 2)) + "px");

            const decPaths = [];
            const totalDec = 40;
            for(let i=0; i < totalDec; i++) {
                let angle = (i / totalDec) * 2 * Math.PI + (Math.random() - 0.5) * 0.1;
                let len = Math.random() * 100 + 40;
                let endX = Math.cos(angle - Math.PI/2) * len;
                let endY = Math.sin(angle - Math.PI/2) * len;
                decPaths.push({ d: getOrganicPath(0, 0, endX, endY), depth: 0 });
            }

            root.descendants().forEach(node => {
                if (node.depth === 1) {
                    for(let i=0; i < 3; i++) {
                        let angle = node.x + (Math.random() - 0.5) * 1.2; 
                        let len = Math.random() * 55 + 25; 
                        let endX = node.cartX + Math.cos(angle - Math.PI/2) * len;
                        let endY = node.cartY + Math.sin(angle - Math.PI/2) * len;
                        decPaths.push({ d: getOrganicPath(node.cartX, node.cartY, endX, endY), depth: 1 });
                    }
                }
            });

            treeLayer.selectAll(".dec-branch")
                .data(decPaths).join("path")
                .attr("class", "branch dec-branch")
                .attr("d", d => d.d)
                .style("stroke-width", d => Math.max(1, 3 - d.depth) + "px");

            const node = treeLayer.selectAll(".node")
                .data(root.descendants()).join("g")
                .attr("class", d => "node " + (d.depth > 0 ? "floating-node" : ""))
                .attr("transform", d => `translate(${d.cartX},${d.cartY})`)
                .style("opacity", 0);

            node.append("circle")
                .attr("class", d => d.depth === 0 ? "core-circle" : "")
                .attr("r", d => d.depth === 0 ? 22 : (d.depth === 1 ? 10 : 7))
                .style("fill", d => d.depth === 0 ? "#9e5c43" : (d.children ? "#2ea043" : "#baf5a9"))
                .on("click", (event, d) => showModal(d.data));

            node.append("text")
                .attr("dy", d => {
                    if (d.depth === 0) return "40px";
                    if (d.cartY < -80) {
                        const idx = d.parent ? d.parent.children.indexOf(d) : 0;
                        return (idx % 2 === 0) ? "-24px" : "-8px";
                    }
                    if (d.cartY > 80) return "1.35em";
                    return "0.35em";
                })
                .attr("x", d => {
                    if (d.depth === 0) return 0;
                    if (Math.abs(d.cartX) < 110 && d.cartY < 0) {
                        const idx = d.parent ? d.parent.children.indexOf(d) : 0;
                        const total = d.parent ? d.parent.children.length : 1;
                        return (idx - (total - 1) / 2) * 32; 
                    }
                    return d.cartX > 0 ? 18 : -18;
                })
                .attr("text-anchor", d => {
                    if (d.depth === 0) return "middle";
                    if (Math.abs(d.cartX) < 110 && d.cartY < 0) return "middle";
                    return d.cartX > 0 ? "start" : "end";
                })
                .text(d => d.depth === 0 ? "Я" : d.data.name)
                .style("font-size", d => d.depth === 0 ? "36px" : (d.depth === 1 ? "22px" : "16px"))
                .style("fill", d => d.depth === 0 ? "#ffffff" : "#f0f5f1")
                .style("font-weight", d => d.depth === 0 ? "900" : "700");

        }).catch(err => console.error("Ошибка загрузки data.json:", err));

        function animateGrowth() {
            d3.selectAll(".branch").each(function() {
                const length = this.getTotalLength();
                d3.select(this)
                    .attr("stroke-dasharray", length)
                    .attr("stroke-dashoffset", length)
                    .transition().duration(2000 + Math.random() * 1500).ease(d3.easeCubicOut)
                    .attr("stroke-dashoffset", 0);
            });
            d3.selectAll(".node").transition().delay(d => 1200 + d.depth * 600).duration(1000).style("opacity", 1);
        }

        function showModal(data) {
            document.getElementById('modal-title').innerText = data.name || "Без названия";
            document.getElementById('modal-desc').innerText = data.desc || "";
            
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = ""; 
            
            if (data.media && Array.isArray(data.media)) {
                data.media.forEach(item => {
                    if (item.type === "image") {
                        gallery.innerHTML += `<img src="${item.url}" class="media-item">`;
                    } else if (item.type === "video") {
                        gallery.innerHTML += `<video controls src="${item.url}" class="media-item"></video>`;
                    } else if (item.type === "audio") {
                        gallery.innerHTML += `
                            <div class="media-audio-container">
                                <div class="media-audio-title">${item.title || "Аудио демо"}</div>
                                <audio controls src="${item.url}"></audio>
                            </div>`;
                    } else if (item.type === "link") {
                        gallery.innerHTML += `<a href="${item.url}" target="_blank" class="media-link" style="display: block; margin-top: 15px; padding: 12px; background-color: #2ea043; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">${item.text || "Перейти ↗"}</a>`;
                    }
                });
            }
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-bg').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('modal-bg').classList.remove('active');
            document.querySelectorAll('#modal-gallery video, #modal-gallery audio').forEach(media => {
                media.pause();
            });
        }
    </script>
</body>
</html>
