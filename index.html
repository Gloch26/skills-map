<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Творческое убежище</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body { margin: 0; background: radial-gradient(circle at center, #111a14 0%, #000000 80%); color: #c9d1d9; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
#spores-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; }
#canvas-container { position: relative; z-index: 1; width: 100vw; height: 100vh; cursor: grab; filter: blur(15px); transform: scale(1.05); transition: filter 1.5s ease, transform 1.5s ease; }
#canvas-container:active { cursor: grabbing; }
#canvas-container.ready { filter: blur(0px); transform: scale(1); }

#welcome-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; text-align: center; padding: 20px; box-sizing: border-box; transition: opacity 0.8s ease, visibility 0.8s; }
#welcome-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#welcome-screen h1 { color: #87ff47; font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 15px; font-weight: 900; text-shadow: 0 0 20px rgba(135, 255, 71, 0.5); text-transform: uppercase; letter-spacing: 2px;}
#welcome-screen p { max-width: 600px; font-size: clamp(1rem, 3vw, 1.2rem); line-height: 1.6; margin-bottom: 35px; color: #a3b8a8; }
#welcome-btn { padding: 15px 40px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase; background-color: #2ea043; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 20px rgba(46, 160, 67, 0.6); }
#welcome-btn:hover { background-color: #47ff69; box-shadow: 0 0 30px rgba(71, 255, 105, 0.8); transform: translateY(-2px); }

.branch { fill: none; stroke-linecap: round; }
.data-branch { stroke: #6ded51; filter: url(#glow); }
.dec-branch { stroke: #3bb02e; opacity: 0.35; }
.node circle { stroke: #000; stroke-width: 2px; cursor: pointer; transition: all 0.3s ease; }
.node circle:hover { filter: brightness(1.5); }
.node text { pointer-events: none; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }

@keyframes coreGlow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(222, 136, 106, 0.4)); }
  50% { filter: drop-shadow(0 0 16px rgba(222, 136, 106, 0.95)) brightness(1.15); }
}
.core-circle { animation: coreGlow 3s ease-in-out infinite; }

.branch-cluster { will-change: transform; }
@keyframes sway0 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(0.45deg); } }
@keyframes sway1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-0.4deg); } }
@keyframes sway2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(0.35deg) scale(1.003); } }
@keyframes sway3 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-0.45deg) scale(0.997); } }

.cluster-0 { animation: sway0 7.5s ease-in-out infinite; transform-origin: 0px 0px; }
.cluster-1 { animation: sway1 9s ease-in-out infinite; transform-origin: 0px 0px; }
.cluster-2 { animation: sway2 6.8s ease-in-out infinite; transform-origin: 0px 0px; }
.cluster-3 { animation: sway3 8.2s ease-in-out infinite; transform-origin: 0px 0px; }

@keyframes centerWhiskers1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(0.8deg); } }
@keyframes centerWhiskers2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-0.8deg); } }
.center-dec-odd { animation: centerWhiskers1 6.5s ease-in-out infinite; transform-origin: 0px 0px; }
.center-dec-even { animation: centerWhiskers2 8.5s ease-in-out infinite; transform-origin: 0px 0px; }

#modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0d0b; border: 1px solid #2ea043; border-radius: 12px; padding: 25px; box-shadow: 0 0 40px rgba(46, 160, 67, 0.3); z-index: 100; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; text-align: center; color: #e6f0e8; box-sizing: border-box; }
#modal.active { display: block; }
#modal-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #5a7560; font-size: 24px; font-weight: bold; }
#modal-close:hover { color: #87ff47; }
#modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; backdrop-filter: blur(5px); }
#modal-bg.active { display: block; }
#modal-desc { color: #a3b8a8; font-size: 1rem; line-height: 1.6; margin-top: 10px; white-space: pre-line; text-align: left; }
.media-item { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #1a291e; }
.media-audio-container { margin-top: 15px; background: #121f15; padding: 12px; border-radius: 8px; border: 1px solid #233827; }
.media-audio-title { font-size: 0.9rem; color: #87ff47; margin-bottom: 6px; font-weight: bold; }
audio { width: 100%; height: 35px; }

/* Карточки сравнения в модалке */
.compare-container { margin-top: 15px; width: 100%; }
.compare-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; cursor: pointer; border-radius: 8px; padding: 3px; transition: transform 0.2s ease, box-shadow 0.2s ease; }
.compare-row:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(135, 255, 71, 0.25); }
.compare-card { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid #1a291e; background: #0e1410; }
.compare-card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; }
.compare-badge { position: absolute; bottom: 6px; left: 6px; background: rgba(0, 0, 0, 0.75); font-size: 0.72rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.badge-before { color: #c9d1d9; border: 1px solid #444; }
.badge-after { color: #87ff47; border: 1px solid rgba(135, 255, 71, 0.4); }

/* Интерактивный полноэкранный слайдер */
#compare-lightbox { display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(12px); z-index: 2000; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
#compare-lightbox.active { opacity: 1; pointer-events: auto; }
.compare-lightbox-content { position: relative; max-width: 92vw; max-height: 85vh; transform: scale(0.75); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
#compare-lightbox.active .compare-lightbox-content { transform: scale(1); }
.compare-close-btn { position: absolute; top: -42px; right: 0; color: #87ff47; font-size: 34px; font-weight: bold; cursor: pointer; line-height: 1; }

.slider-stage { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid #2ea043; box-shadow: 0 0 35px rgba(46, 160, 67, 0.35); user-select: none; touch-action: none; --pos: 50%; }
.slider-stage img { display: block; max-width: 90vw; max-height: 80vh; width: auto; height: auto; object-fit: contain; }
.slider-img-top { position: absolute; top: 0; left: 0; width: 100%; height: 100%; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.slider-divider { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; background: #87ff47; box-shadow: 0 0 10px #87ff47; pointer-events: none; }
.slider-handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; background: #0a0d0b; border: 2px solid #87ff47; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #87ff47; font-size: 16px; box-shadow: 0 0 15px rgba(135, 255, 71, 0.6); }
.slider-tag { position: absolute; top: 15px; background: rgba(0, 0, 0, 0.75); font-size: 0.8rem; font-weight: bold; padding: 4px 10px; border-radius: 6px; pointer-events: none; }
.tag-before { left: 15px; color: #c9d1d9; border: 1px solid #444; }
.tag-after { right: 15px; color: #87ff47; border: 1px solid rgba(135, 255, 71, 0.4); }

@media (max-width: 768px) {
  .data-branch { filter: url(#glow-mobile); }
  @keyframes sway0 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1.2deg); } }
  @keyframes sway1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.1deg); } }
  @keyframes sway2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(1deg) scale(1.006); } }
  @keyframes sway3 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-1.2deg) scale(0.994); } }
}
</style>
</head>
<body>
<canvas id="spores-canvas"></canvas>

<div id="welcome-screen">
  <h1>Творческое убежище</h1>
  <p>По мотивам видео "кто ты"<br>(Новые ноды в загрузке)</p>
  <button id="welcome-btn" onclick="enterUniverse()">Прорастить структуру</button>
</div>

<div id="canvas-container"></div>

<div id="modal-bg" onclick="closeModal()"></div>
<div id="modal">
  <span id="modal-close" onclick="closeModal()">&times;</span>
  <h2 id="modal-title" style="margin-top: 0; color: #87ff47;"></h2>
  <p id="modal-desc"></p>
  <div id="modal-gallery"></div>
</div>

<!-- Окно сравнения До/После (расположено до скрипта) -->
<div id="compare-lightbox" onclick="closeCompareSlider()">
  <div class="compare-lightbox-content" onclick="event.stopPropagation()">
    <span class="compare-close-btn" onclick="closeCompareSlider()">&times;</span>
    <div class="slider-stage" id="slider-stage">
      <img id="slider-img-after" src="" alt="AI">
      <img id="slider-img-before" class="slider-img-top" src="" alt="Исходник">
      <div class="slider-divider">
        <div class="slider-handle">↔</div>
      </div>
      <span class="slider-tag tag-before">Исходник</span>
      <span class="slider-tag tag-after">AI</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('spores-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  if(svgSel) { svgSel.attr("width", w).attr("height", h); }
});

const particleCount = window.innerWidth < 768 ? 35 : 70;
const particles = Array.from({length: particleCount}, () => ({
  x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + 0.5,
  dx: (Math.random() - 0.5) * 0.2, dy: (Math.random() - 0.5) * 0.2 - 0.1,
  alpha: Math.random() * Math.PI * 2, speed: Math.random() * 0.02 + 0.01
}));

let particlesRAF = null;
function drawParticles() {
  ctx.clearRect(0, 0, w, h);
  particles.forEach(p => {
    p.x += p.dx; p.y += p.dy; p.alpha += p.speed;
    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0; if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(135, 255, 71, ${(Math.sin(p.alpha) + 1) / 2 * 0.5})`;
    ctx.fill();
  });
  particlesRAF = requestAnimationFrame(drawParticles);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (particlesRAF) cancelAnimationFrame(particlesRAF);
    particlesRAF = null;
  } else if (!particlesRAF) {
    drawParticles();
  }
});
drawParticles();

let isGrown = false;
function enterUniverse() {
  document.getElementById('welcome-screen').classList.add('hidden');
  document.getElementById('canvas-container').classList.add('ready');
  if (!isGrown) { animateGrowth(); isGrown = true; }
}

const widthD3 = window.innerWidth;
const heightD3 = window.innerHeight;
const svgSel = d3.select("#canvas-container").append("svg").attr("width", widthD3).attr("height", heightD3);
const defs = svgSel.append("defs");

const filter = defs.append("filter")
  .attr("id", "glow")
  .attr("x", "-20%").attr("y", "-20%")
  .attr("width", "140%").attr("height", "140%");
filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "blur");
const feMerge = filter.append("feMerge");
feMerge.append("feMergeNode").attr("in", "blur");
feMerge.append("feMergeNode").attr("in", "SourceGraphic");

const filterMobile = defs.append("filter")
  .attr("id", "glow-mobile")
  .attr("x", "-20%").attr("y", "-20%")
  .attr("width", "140%").attr("height", "140%");
filterMobile.append("feGaussianBlur").attr("stdDeviation", "1.2").attr("result", "blurMobile");
const feMergeMobile = filterMobile.append("feMerge");
feMergeMobile.append("feMergeNode").attr("in", "blurMobile");
feMergeMobile.append("feMergeNode").attr("in", "SourceGraphic");

const g = svgSel.append("g");
const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", (event) => { g.attr("transform", event.transform); });
svgSel.call(zoom);

const initialScale = window.innerWidth < 768 ? 0.48 : 0.95;
svgSel.call(zoom.transform, d3.zoomIdentity.translate(widthD3 / 2, heightD3 / 2).scale(initialScale));

const treeLayer = g.append("g").attr("class", "tree-layer");
const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));

function getStaticOrganicPath(x1, y1, x2, y2) {
  let dx = x2 - x1; let dy = y2 - y1;
  let dist = Math.hypot(dx, dy);
  if (dist === 0) return lineGen([[x1, y1], [x2, y2]]);
  let perpX = -dy / dist; let perpY = dx / dist;
  let seed = Math.sin(x1 * 12.9898 + y1 * 78.233) * 43758.5453;
  let noise = (seed - Math.floor(seed)) - 0.5;
  let bow = dist * 0.18 * noise;
  let p1x = x1 + dx * 0.3 + perpX * bow;
  let p1y = y1 + dy * 0.3 + perpY * bow;
  let p2x = x1 + dx * 0.7 - perpX * (bow * 0.8);
  let p2y = y1 + dy * 0.7 - perpY * (bow * 0.8);
  return lineGen([[x1, y1], [p1x, p1y], [p2x, p2y], [x2, y2]]);
}

d3.json("data.json?v=" + Date.now()).then(data => {
  const root = d3.hierarchy(data);

  root.eachBefore(d => {
    if (d.depth === 0) {
      d.x = 0; d.y = 0;
      d.cartX = 0; d.cartY = 0;
    } else if (d.depth === 1) {
      const count = d.parent.children.length;
      const i = d.parent.children.indexOf(d);
      d.x = (i / count) * 2 * Math.PI + 0.001;
      d.y = 220;
      d.cartX = Math.cos(d.x - Math.PI/2) * d.y;
      d.cartY = Math.sin(d.x - Math.PI/2) * d.y;
    } else {
      const count = d.parent.children.length;
      const i = d.parent.children.indexOf(d);
      const rootSiblingsCount = d.parent.parent.children.length;
      const availableSector = (2 * Math.PI) / rootSiblingsCount;
      const spread = availableSector * 0.85;
      d.x = count === 1 ? d.parent.x : d.parent.x - spread/2 + (i / (count - 1)) * spread;
      d.x += 0.001;
      d.y = d.parent.y + 160;
      d.cartX = Math.cos(d.x - Math.PI/2) * d.y;
      d.cartY = Math.sin(d.x - Math.PI/2) * d.y;
    }
  });

  const centerDecGroup = treeLayer.append("g").attr("class", "center-dec-container");
  const totalDec = window.innerWidth < 768 ? 20 : 36;
  for(let i=0; i < totalDec; i++) {
    let angle = (i / totalDec) * 2 * Math.PI + (Math.random() - 0.5) * 0.1;
    let len = Math.random() * 90 + 35;
    let endX = Math.cos(angle - Math.PI/2) * len;
    let endY = Math.sin(angle - Math.PI/2) * len;
    centerDecGroup.append("path")
      .attr("class", "branch dec-branch " + (i % 2 === 0 ? "center-dec-even" : "center-dec-odd"))
      .attr("d", getStaticOrganicPath(0, 0, endX, endY))
      .style("stroke-width", "1.5px");
  }

  root.children.forEach((mainNode, i) => {
    const cluster = treeLayer.append("g")
      .attr("class", `branch-cluster cluster-${i % 4}`);

    cluster.append("path")
      .attr("class", "branch data-branch")
      .attr("d", getStaticOrganicPath(0, 0, mainNode.cartX, mainNode.cartY))
      .style("stroke-width", "6px");

    for(let j=0; j < 2; j++) {
      let angle = mainNode.x + (Math.random() - 0.5) * 1.2;
      let len = Math.random() * 55 + 25;
      let endX = mainNode.cartX + Math.cos(angle - Math.PI/2) * len;
      let endY = mainNode.cartY + Math.sin(angle - Math.PI/2) * len;
      cluster.append("path")
        .attr("class", "branch dec-branch")
        .attr("d", getStaticOrganicPath(mainNode.cartX, mainNode.cartY, endX, endY))
        .style("stroke-width", "1.5px");
    }

    if (mainNode.children) {
      mainNode.children.forEach(subNode => {
        cluster.append("path")
          .attr("class", "branch data-branch")
          .attr("d", getStaticOrganicPath(mainNode.cartX, mainNode.cartY, subNode.cartX, subNode.cartY))
          .style("stroke-width", "4px");
      });
    }

    const clusterNodes = [mainNode, ...(mainNode.children || [])];
    const nodeSel = cluster.selectAll(".node")
      .data(clusterNodes).join("g")
      .attr("class", "node")
      .attr("transform", d => `translate(${d.cartX},${d.cartY})`)
      .style("opacity", 0);

    nodeSel.append("circle")
      .attr("r", d => d.depth === 1 ? 10 : 7)
      .style("fill", d => d.children ? "#2ea043" : "#baf5a9")
      .on("click", (event, d) => showModal(d.data));

    nodeSel.append("text")
      .attr("dy", d => {
        if (d.cartY < -80) {
          const idx = d.parent ? d.parent.children.indexOf(d) : 0;
          return (idx % 2 === 0) ? "-24px" : "-8px";
        }
        if (d.cartY > 80) return "1.35em";
        return "0.35em";
      })
      .attr("x", d => {
        if (Math.abs(d.cartX) < 110 && d.cartY < 0) {
          const idx = d.parent ? d.parent.children.indexOf(d) : 0;
          const total = d.parent ? d.parent.children.length : 1;
          return (idx - (total - 1) / 2) * 32;
        }
        return d.cartX > 0 ? 18 : -18;
      })
      .attr("text-anchor", d => {
        if (Math.abs(d.cartX) < 110 && d.cartY < 0) return "middle";
        return d.cartX > 0 ? "start" : "end";
      })
      .text(d => d.data.name)
      .style("font-size", d => d.depth === 1 ? "22px" : "16px")
      .style("fill", "#f0f5f1")
      .style("font-weight", "700");
  });

  const coreGroup = treeLayer.append("g")
    .attr("class", "node core-node")
    .style("opacity", 0);

  const coreCircle = coreGroup.append("circle")
    .attr("class", "core-circle")
    .attr("r", 22)
    .style("fill", "#9e5c43")
    .on("click", () => showModal(root.data));

  coreCircle.append("animate")
    .attr("attributeName", "r")
    .attr("values", "21; 24.5; 21")
    .attr("dur", "2.8s")
    .attr("repeatCount", "indefinite")
    .attr("calcMode", "spline")
    .attr("keySplines", "0.4 0 0.2 1; 0.4 0 0.2 1");

  coreGroup.append("text")
    .attr("dy", "0.36em")
    .attr("text-anchor", "middle")
    .text("Я")
    .style("font-size", "26px")
    .style("fill", "#ffffff")
    .style("font-weight", "900");

}).catch(err => console.error("Ошибка загрузки data.json:", err));

function animateGrowth() {
  d3.selectAll(".dec-branch")
    .style("opacity", 0)
    .transition().duration(900).ease(d3.easeCubicOut)
    .style("opacity", 0.35);

  d3.selectAll(".data-branch").each(function() {
    const length = this.getTotalLength();
    d3.select(this)
      .attr("stroke-dasharray", length)
      .attr("stroke-dashoffset", length)
      .transition().duration(1500).ease(d3.easeCubicOut)
      .attr("stroke-dashoffset", 0);
  });

  d3.selectAll(".node").transition().delay(800).duration(800).style("opacity", 1);
}

function showModal(data) {
  let title = data.name || "Без названия";
  if (title.includes("ЯДРО") || title === "Я") {
    title = "Я";
  }
  document.getElementById('modal-title').innerText = title;
  document.getElementById('modal-desc').innerText = data.desc || "";
  const gallery = document.getElementById('modal-gallery');
  gallery.innerHTML = "";

  if (data.media && Array.isArray(data.media)) {
    data.media.forEach(item => {
      if (item.type === "image") {
        gallery.innerHTML += `<img src="${item.url}" class="media-item">`;
      } else if (item.type === "video") {
        gallery.innerHTML += `<video controls src="${item.url}" class="media-item"></video>`;
      } else if (item.type === "audio") {
        gallery.innerHTML += `
          <div class="media-audio-container">
            <div class="media-audio-title">${item.title || "Аудио демо"}</div>
            <audio controls src="${item.url}"></audio>
          </div>`;
      } else if (item.type === "link") {
        gallery.innerHTML += `<a href="${item.url}" target="_blank" class="media-link" style="display: block; margin-top: 15px; padding: 12px; background-color: #2ea043; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">${item.text || "Перейти ↗"}</a>`;
      } else if (item.type === "comparison" && item.pairs) {
        let compHtml = `<div class="compare-container">`;
        item.pairs.forEach(pair => {
          compHtml += `
            <div class="compare-row" onclick="openCompareSlider('${pair.before}', '${pair.after}')" title="Нажмите для интерактивного сравнения">
              <div class="compare-card">
                <img src="${pair.before}" alt="Исходник">
                <div class="compare-badge badge-before">Исходник</div>
              </div>
              <div class="compare-card">
                <img src="${pair.after}" alt="AI">
                <div class="compare-badge badge-after">AI ↔</div>
              </div>
            </div>`;
        });
        compHtml += `</div>`;
        gallery.innerHTML += compHtml;
      }
    });
  }

  document.getElementById('modal').classList.add('active');
  document.getElementById('modal-bg').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.getElementById('modal-bg').classList.remove('active');
  document.querySelectorAll('#modal-gallery video, #modal-gallery audio').forEach(media => {
    media.pause();
  });
}

// Управление интерактивным сравнением До/После
let isSliding = false;

function openCompareSlider(beforeUrl, afterUrl) {
  const stage = document.getElementById('slider-stage');
  const imgBefore = document.getElementById('slider-img-before');
  const imgAfter = document.getElementById('slider-img-after');
  const lightbox = document.getElementById('compare-lightbox');

  if (imgBefore && imgAfter && stage && lightbox) {
    imgBefore.src = beforeUrl;
    imgAfter.src = afterUrl;
    stage.style.setProperty('--pos', '50%');
    lightbox.classList.add('active');
  }
}

function closeCompareSlider() {
  const lightbox = document.getElementById('compare-lightbox');
  if (lightbox) lightbox.classList.remove('active');
}

function setSliderPos(clientX) {
  const stage = document.getElementById('slider-stage');
  if (!stage) return;
  const rect = stage.getBoundingClientRect();
  let pos = ((clientX - rect.left) / rect.width) * 100;
  pos = Math.max(0, Math.min(100, pos));
  stage.style.setProperty('--pos', `${pos}%`);
}

const sliderStage = document.getElementById('slider-stage');
if (sliderStage) {
  sliderStage.addEventListener('pointerdown', (e) => {
    isSliding = true;
    sliderStage.setPointerCapture(e.pointerId);
    setSliderPos(e.clientX);
  });

  sliderStage.addEventListener('pointermove', (e) => {
    if (isSliding) setSliderPos(e.clientX);
  });

  sliderStage.addEventListener('pointerup', (e) => {
    isSliding = false;
    try { sliderStage.releasePointerCapture(e.pointerId); } catch (_) {}
  });

  sliderStage.addEventListener('pointercancel', () => { isSliding = false; });
}
</script>
