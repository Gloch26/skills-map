<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Древа талантов</title>
<meta name="description" content="Интерактивная органическая карта навыков — дерево из веток, которое можно исследовать, кликать по узлам и находить пасхалки.">
<meta property="og:type" content="website">
<meta property="og:title" content="Древа талантов">
<meta property="og:description" content="Интерактивная органическая карта навыков — дерево из веток, которое можно исследовать, кликать по узлам и находить пасхалки.">
<meta property="og:image" content="https://gloch26.github.io/skills-map/assets/og-image.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%BF</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<canvas id="spores-canvas"></canvas>

   <div class="bg-blob" id="bg-blob-1"></div>
<div class="bg-blob" id="bg-blob-2"></div>

<div id="welcome-screen">
  <h1>Древа талантов</h1>
  <p>По мотивам видео "кто ты"<br>(Новые ноды в загрузке)</p>
  <button id="welcome-btn" onclick="enterUniverse()">Прорастить структуру</button>
</div>

<div id="canvas-container"></div>


<audio id="bg-music" src="assets/aud/Reverse Tape Swells.mp3" loop preload="none"></audio>
<button id="music-toggle" onclick="toggleBackgroundMusic()" title="Вкл/выкл музыку">🔊</button>
<button id="reset-view-btn" onclick="resetView()" title="Сбросить вид">⟲</button>
<div id="explore-progress"></div>

 <!-- Редкая "золотая спора" — пасхалка на внимательность. Появляется на пару
     секунд в случайном месте экрана и гаснет, если не поймать. Клик по ней
     открывает подборку лучших видео. -->  
<div id="rare-spore" onclick="catchRareSpore(event)"></div>

<div id="modal-bg" onclick="closeModal()"></div>
<div id="modal">
  <span id="modal-close" onclick="closeModal()">&times;</span>
  <h2 id="modal-title" style="margin-top: 0; color: #87ff47;"></h2>
  <p id="modal-desc"></p>
  <div id="modal-gallery"></div>
</div>

<!-- Окно интерактивного сравнения До/После -->
<div id="compare-lightbox" onclick="closeCompareSlider()">
  <div class="compare-lightbox-content" onclick="event.stopPropagation()">
    <span class="compare-close-btn" onclick="closeCompareSlider()">&times;</span>
    <div class="slider-stage" id="slider-stage">
      <img id="slider-img-after" src="" alt="AI" draggable="false">
      <img id="slider-img-before" class="slider-img-top" src="" alt="Исходник" draggable="false">
      <div class="slider-divider">
        <div class="slider-handle">↔</div>
      </div>
      <span class="slider-tag tag-before">Исходник</span>
      <span class="slider-tag tag-after">AI</span>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
