<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Творческое убежище</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: radial-gradient(circle at center, #111a14 0%, #000000 80%);
            color: #c9d1d9; 
            font-family: system-ui, -apple-system, sans-serif; 
            overflow: hidden; 
        }
        #canvas-container { 
            width: 100vw; height: 100vh; cursor: grab; 
            filter: blur(15px); transform: scale(1.05); 
            transition: filter 1.5s ease, transform 1.5s ease; 
        }
        #canvas-container:active { cursor: grabbing; }
        #canvas-container.ready { filter: blur(0px); transform: scale(1); }

        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        #welcome-screen h1 { color: #87ff47; font-size: 3rem; margin-bottom: 10px; font-weight: 900; text-shadow: 0 0 20px rgba(135, 255, 71, 0.5); text-transform: uppercase; letter-spacing: 2px;}
        #welcome-screen p { max-width: 600px; font-size: 1.2rem; line-height: 1.6; margin-bottom: 40px; color: #a3b8a8; }
        #welcome-btn {
            padding: 15px 40px; font-size: 1.1rem; font-weight: bold; text-transform: uppercase;
            background-color: #2ea043; color: #000; border: none; border-radius: 30px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.6);
        }
        #welcome-btn:hover { background-color: #47ff69; box-shadow: 0 0 30px rgba(71, 255, 105, 0.8); transform: translateY(-2px); }

        /* Ветви и свечение */
        .branch { fill: none; filter: url(#glow); stroke-linecap: round; }
        .data-branch { stroke: #6ded51; }
        .dec-branch { stroke: #3bb02e; opacity: 0.4; }
        
        .node circle { stroke: #000; stroke-width: 2px; cursor: pointer; transition: all 0.3s ease; }
        .node circle:hover { filter: brightness(1.5) drop-shadow(0 0 10px #87ff47); r: 14; }
        
        /* Обновленные стили текста с жесткой обводкой */
        .node text { 
            pointer-events: none; 
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000, 
                2px -2px 0 #000, -2px 2px 0 #000, 
                0 0 15px #000, 0 0 25px rgba(0,0,0,0.9); 
        }

        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0a0d0b; border: 1px solid #2ea043; border-radius: 12px; padding: 20px; box-shadow: 0 0 40px rgba(46, 160, 67, 0.3); z-index: 100; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; text-align: center; color: #e6f0e8; }
        #modal.active { display: block; }
        #modal-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #5a7560; font-size: 24px; font-weight: bold; }
        #modal-close:hover { color: #87ff47; }
        #modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 99; backdrop-filter: blur(5px); }
        #modal-bg.active { display: block; }
        .media-item { width: 100%; border-radius: 8px; margin-top: 15px; border: 1px solid #1a291e; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1>Творческое убежище</h1>
        <p>Нажмите для генерации органической структуры.</p>
        <button id="welcome-btn" onclick="enterUniverse()">Прорастить</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="modal-bg" onclick="closeModal()"></div>
    <div id="modal">
        <span id="modal-close" onclick="closeModal()">&times;</span>
        <h2 id="modal-title" style="margin-top: 0; color: #87ff47;"></h2>
        <p id="modal-desc"></p>
        <div id="modal-gallery"></div>
    </div>

    <script>
        let isGrown = false;

        function enterUniverse() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('canvas-container').classList.add('ready');
            if (!isGrown) { animateGrowth(); isGrown = true; }
        }

        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#canvas-container").append("svg").attr("width", width).attr("height", height);
        
        const defs = svg.append("defs");
        const filter = defs.append("filter").attr("id", "glow");
        filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode").attr("in", "coloredBlur");
        feMerge.append("feMergeNode").attr("in", "SourceGraphic");

        const g = svg.append("g");
        
        const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);
        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));

        const lineGen = d3.line().x(d => d[0]).y(d => d[1]).curve(d3.curveCatmullRom.alpha(0.5));
        function getOrganicPath(x1, y1, x2, y2, jitter) {
            let points = [[x1, y1]];
            let dist = Math.hypot(x2 - x1, y2 - y1);
            let segments = Math.max(2, Math.floor(dist / 25));
            let dx = x2 - x1;
            let dy = y2 - y1;
            
            let curveDir = Math.random() > 0.5 ? 1 : -1;
            let curveIntensity = dist * (0.1 + Math.random() * 0.15);

            for(let i=1; i<segments; i++) {
                let t = i / segments;
                let perpX = -dy / dist;
                let perpY = dx / dist;
                let bow = Math.sin(t * Math.PI) * curveDir * curveIntensity;
                
                let bx = x1 + dx * t + perpX * bow;
                let by = y1 + dy * t + perpY * bow;

                points.push([
                    bx + (Math.random() - 0.5) * jitter,
                    by + (Math.random() - 0.5) * jitter
                ]);
            }
            points.push([x2, y2]);
            return lineGen(points);
        }

        d3.json("data.json").then(data => {
            const root = d3.hierarchy(data);
            const tree = d3.tree().size([2 * Math.PI, 450]); 
            tree(root);

            root.descendants().forEach(d => {
                d.cartX = Math.cos(d.x - Math.PI/2) * d.y;
                d.cartY = Math.sin(d.x - Math.PI/2) * d.y;
            });

            const decPaths = [];
            root.descendants().forEach(node => {
                const numSprouts = node.depth === 0 ? 12 : (node.depth === 1 ? 5 : 2);
                for(let i=0; i < numSprouts; i++) {
                    const angle = node.x + (Math.random() - 0.5) * 2; 
                    const len = Math.random() * 200 + 50;
                    const endX = node.cartX + Math.cos(angle - Math.PI/2) * len;
                    const endY = node.cartY + Math.sin(angle - Math.PI/2) * len;
                    decPaths.push({ d: getOrganicPath(node.cartX, node.cartY, endX, endY, 20), depth: node.depth });
                }
            });

            g.selectAll(".dec-branch")
                .data(decPaths).join("path")
                .attr("class", "branch dec-branch")
                .attr("d", d => d.d)
                .style("stroke-width", d => Math.max(1, 4 - d.depth) + "px");

            g.selectAll(".data-branch")
                .data(root.links()).join("path")
                .attr("class", "branch data-branch")
                .attr("d", d => getOrganicPath(d.source.cartX, d.source.cartY, d.target.cartX, d.target.cartY, 15))
                .style("stroke-width", d => Math.max(2, 8 - (d.target.depth * 2)) + "px");

            const node = g.selectAll(".node")
                .data(root.descendants()).join("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.cartX},${d.cartY})`)
                .style("opacity", 0);

            node.append("circle")
                .attr("r", d => d.depth === 0 ? 20 : (d.depth === 1 ? 9 : 6))
                .style("fill", d => d.depth === 0 ? "#9e5c43" : (d.children ? "#2ea043" : "#baf5a9"))
                .on("click", (event, d) => showModal(d.data));

            // Обновленная логика генерации текста
            node.append("text")
                // Для ядра сдвигаем текст вниз (35px), для остальных центрируем по вертикали
                .attr("dy", d => d.depth === 0 ? "35px" : "0.31em")
                // Для ядра позиция X по центру (0), для остальных отодвигаем на 25px
                .attr("x", d => d.depth === 0 ? 0 : (d.cartX > 0 ? 25 : -25))
                // Ядро центрируется (middle), остальные привязываются к краям
                .attr("text-anchor", d => d.depth === 0 ? "middle" : (d.cartX > 0 ? "start" : "end"))
                // Заменяем имя нулевого узла на "Я"
                .text(d => d.depth === 0 ? "Я" : d.data.name)
                // Каскадное изменение размеров шрифта
                .style("font-size", d => d.depth === 0 ? "36px" : (d.depth === 1 ? "22px" : "15px"))
                // Делаем цвет шрифта чуть белее для контраста, а для ядра — терракотовый
                .style("fill", d => d.depth === 0 ? "#de886a" : "#f0f5f1")
                .style("font-weight", d => d.depth === 0 ? "900" : "700");

        }).catch(err => console.error("Ошибка загрузки data.json:", err));

        function animateGrowth() {
            d3.selectAll(".branch").each(function() {
                const length = this.getTotalLength();
                d3.select(this)
                    .attr("stroke-dasharray", length)
                    .attr("stroke-dashoffset", length)
                    .transition().duration(1500 + Math.random() * 1000).ease(d3.easeCubicOut)
                    .attr("stroke-dashoffset", 0);
            });
            d3.selectAll(".node").transition().delay(d => 1000 + d.depth * 500).duration(800).style("opacity", 1);
        }

        function showModal(data) {
            document.getElementById('modal-title').innerText = data.name;
            document.getElementById('modal-desc').innerText = data.desc || "";
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = ""; 
            if (data.media) {
                data.media.forEach(item => {
                    if (item.type === "image") gallery.innerHTML += `<img src="${item.url}" class="media-item">`;
                    else if (item.type === "video") gallery.innerHTML += `<video controls src="${item.url}" class="media-item"></video>`;
                    else if (item.type === "link") gallery.innerHTML += `<a href="${item.url}" target="_blank" class="media-link" style="display: block; margin-top: 15px; padding: 12px; background-color: #2ea043; color: #000; text-decoration: none; border-radius: 6px; font-weight: bold;">Перейти ↗</a>`;
                });
            }
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-bg').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('modal-bg').classList.remove('active');
            document.querySelectorAll('#modal-gallery video').forEach(vid => vid.pause());
        }
    </script>
</body>
</html>
