<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Skills Blueprint</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* Фоновая координатная сетка в стиле чертежа */
        body { 
            margin: 0; 
            background-color: #03050a; 
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #c9d1d9; 
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden; 
        }
        
        #canvas-container { 
            width: 100vw; height: 100vh; cursor: crosshair; 
            filter: blur(20px); transform: scale(1.1); 
            transition: filter 1s ease, transform 1s ease; 
        }
        #canvas-container:active { cursor: grabbing; }
        #canvas-container.ready { filter: blur(0px); transform: scale(1); }

        /* Стартовый экран */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(3, 5, 10, 0.9); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; text-align: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #welcome-screen.hidden { opacity: 0; visibility: hidden; }
        #welcome-screen h1 { color: #ff0055; font-size: 3.5rem; margin-bottom: 10px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
        #welcome-screen p { max-width: 600px; font-size: 1.2rem; margin-bottom: 40px; color: #00f0ff; text-transform: uppercase; letter-spacing: 2px; }
        #welcome-btn {
            padding: 15px 50px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; letter-spacing: 3px;
            background: transparent; color: #00f0ff; border: 2px solid #00f0ff; border-radius: 4px;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2) inset, 0 0 15px rgba(0, 240, 255, 0.2);
        }
        #welcome-btn:hover { background-color: #00f0ff; color: #000; box-shadow: 0 0 30px rgba(0, 240, 255, 0.8); }

        /* Оптоволоконные линии */
        .link { 
            fill: none; 
            stroke: #00f0ff; 
            opacity: 0.6;
            filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.8));
        }

        /* Узлы */
        .node circle { 
            stroke: #03050a; stroke-width: 3px; 
            cursor: crosshair; transition: all 0.3s cubic-bezier(0.25, 1.5, 0.5, 1); 
        }
        .node circle:hover { filter: brightness(1.8) drop-shadow(0 0 15px #ff0055); r: 14; stroke: #ff0055; }
        
        /* Скрытый по умолчанию текст */
        .node-label { 
            font-size: 15px; font-weight: bold; fill: #ff0055; 
            pointer-events: none; opacity: 0; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 0px #03050a, -2px -2px 0px #03050a, 2px -2px 0px #03050a, -2px 2px 0px #03050a, 0 0 10px #ff0055; 
        }

        /* Модальное окно */
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(3, 5, 10, 0.95); border: 1px solid #00f0ff; border-radius: 4px; padding: 30px; box-shadow: 0 0 40px rgba(0, 240, 255, 0.2); z-index: 100; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: center; color: #e6f0e8; backdrop-filter: blur(10px); }
        #modal.active { display: block; }
        #modal-close { position: absolute; top: 15px; right: 20px; cursor: pointer; color: #00f0ff; font-size: 24px; font-weight: bold; transition: color 0.2s; }
        #modal-close:hover { color: #ff0055; }
        #modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 99; backdrop-filter: blur(3px); }
        #modal-bg.active { display: block; }
        .media-item { width: 100%; border-radius: 4px; margin-top: 15px; border: 1px solid #00f0ff; }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <h1>Система Инициализирована</h1>
        <p>Доступ к базе данных: Разрешен</p>
        <button id="welcome-btn" onclick="enterUniverse()">Войти в терминал</button>
    </div>

    <div id="canvas-container"></div>
    
    <div id="modal-bg" onclick="closeModal()"></div>
    <div id="modal">
        <span id="modal-close" onclick="closeModal()">[X]</span>
        <h2 id="modal-title" style="margin-top: 0; color: #ff0055; text-transform: uppercase; letter-spacing: 2px;"></h2>
        <p id="modal-desc" style="color: #00f0ff; font-family: monospace;"></p>
        <div id="modal-gallery"></div>
    </div>

    <script>
        let isGrown = false;

        function enterUniverse() {
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('canvas-container').classList.add('ready');
            if (!isGrown) { animateGrowth(); isGrown = true; }
        }

        const width = window.innerWidth;
        const height = window.innerHeight;
        const svg = d3.select("#canvas-container").append("svg").attr("width", width).attr("height", height);
        const g = svg.append("g");
        
        const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", (event) => { g.attr("transform", event.transform); });
        svg.call(zoom);
        svg.call(zoom.transform, d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8));

        d3.json("data.json").then(data => {
            const root = d3.hierarchy(data);
            const tree = d3.tree().size([2 * Math.PI, 350]); // 350 - радиус графа
            tree(root);

            // Идеальные гладкие кривые оптоволокна
            const linkGenerator = d3.linkRadial().angle(d => d.x).radius(d => d.y);

            g.selectAll(".link")
                .data(root.links())
                .join("path")
                .attr("class", "link")
                .attr("d", linkGenerator)
                .style("stroke-width", d => Math.max(1.5, 5 - d.target.depth) + "px");

            const node = g.selectAll(".node")
                .data(root.descendants())
                .join("g")
                .attr("class", "node")
                .attr("transform", d => `rotate(${d.x * 180 / Math.PI - 90}) translate(${d.y},0)`)
                .style("opacity", 0); // Скрыты до анимации

            // Круги узлов (голографические точки)
            node.append("circle")
                .attr("r", d => d.depth === 0 ? 15 : (d.children ? 10 : 6))
                .style("fill", d => d.depth === 0 ? "#ff0055" : "#00f0ff")
                .on("click", (event, d) => showModal(d.data));

            // Текст (Скрыт по умолчанию)
            node.append("text")
                .attr("class", "node-label")
                .attr("dy", "0.31em")
                .attr("x", d => d.x < Math.PI === !d.children ? 25 : -25)
                .attr("text-anchor", d => d.x < Math.PI === !d.children ? "start" : "end")
                .attr("transform", d => d.x >= Math.PI ? "rotate(180)" : null)
                .text(d => d.data.name);

            // Логика Hover: плавное появление текста
            node.on("mouseenter", function(event, d) {
                d3.select(this).select("circle").style("fill", "#ff0055").attr("r", 12);
                d3.select(this).select("text")
                    .transition().duration(300)
                    .style("opacity", 1)
                    .attr("x", d.x < Math.PI === !d.children ? 30 : -30); // Текст чуть отъезжает в сторону
            }).on("mouseleave", function(event, d) {
                d3.select(this).select("circle").style("fill", d.depth === 0 ? "#ff0055" : "#00f0ff")
                  .attr("r", d.depth === 0 ? 15 : (d.children ? 10 : 6));
                d3.select(this).select("text")
                    .transition().duration(200)
                    .style("opacity", 0)
                    .attr("x", d.x < Math.PI === !d.children ? 25 : -25);
            });

        }).catch(err => console.error("Ошибка загрузки data.json:", err));

        // Анимация раскрытия сети (Sci-Fi Boot Sequence)
        function animateGrowth() {
            d3.selectAll(".link").each(function() {
                const length = this.getTotalLength();
                d3.select(this)
                    .attr("stroke-dasharray", length)
                    .attr("stroke-dashoffset", length)
                    .transition().duration(1500).ease(d3.easeCubicInOut)
                    .attr("stroke-dashoffset", 0);
            });
            d3.selectAll(".node").transition().delay(d => 500 + d.depth * 400).duration(800).style("opacity", 1);
        }

        // Модальное окно
        function showModal(data) {
            document.getElementById('modal-title').innerText = "> " + data.name + " _";
            document.getElementById('modal-desc').innerText = data.desc || "Нет дополнительных данных.";
            const gallery = document.getElementById('modal-gallery');
            gallery.innerHTML = ""; 
            if (data.media) {
                data.media.forEach(item => {
                    if (item.type === "image") gallery.innerHTML += `<img src="${item.url}" class="media-item">`;
                    else if (item.type === "video") gallery.innerHTML += `<video controls src="${item.url}" class="media-item"></video>`;
                });
            }
            document.getElementById('modal').classList.add('active');
            document.getElementById('modal-bg').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('modal-bg').classList.remove('active');
            document.querySelectorAll('#modal-gallery video').forEach(vid => vid.pause());
        }
    </script>
</body>
</html>
